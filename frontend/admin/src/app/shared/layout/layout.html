<div class="shell">
  <!-- Mobile top bar. Below 960px the sidebar becomes an off-canvas drawer: as a permanent
       232px column it ate more than half of a 375px phone, leaving the tables it exists to
       navigate to squeezed into what was left. -->
  <header class="topbar">
    <button
      type="button"
      class="btn--icon topbar__menu"
      aria-label="Open navigation"
      aria-controls="adminSidebar"
      [attr.aria-expanded]="navOpen()"
      (click)="toggleNav()"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20" aria-hidden="true">
        <path d="M4 6h16" /><path d="M4 12h16" /><path d="M4 18h16" />
      </svg>
    </button>
    <span class="topbar__brand">freshOmill <span>Admin</span></span>
  </header>

  <div
    class="shell__scrim"
    [class.is-open]="navOpen()"
    aria-hidden="true"
    (click)="closeNav()"
  ></div>

  <aside class="sidebar" id="adminSidebar" [class.is-open]="navOpen()">
    <div class="sidebar__brand">
      freshOmill <span>Admin</span>
      <button type="button" class="btn--icon sidebar__close" aria-label="Close navigation" (click)="closeNav()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true">
          <path d="M18 6 6 18" /><path d="m6 6 12 12" />
        </svg>
      </button>
    </div>

    <!-- Grouped rather than one flat list of six: "Catalogue" is what an operator touches
         daily, "Storefront" is the marketing content they edit occasionally. Icons give each
         row a fixed anchor point so the list is scannable without reading every label. -->
    <nav class="sidebar__nav" aria-label="Admin sections">
      @for (group of navGroups; track group.title) {
        <div class="sidebar__group">
          <span class="sidebar__group-title">{{ group.title }}</span>
          @for (item of group.items; track item.path) {
            <a
              [routerLink]="item.path"
              routerLinkActive="is-active"
              class="sidebar__link"
              (click)="closeNav()"
            >
              <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="17" height="17" aria-hidden="true">
                @for (d of item.paths; track d) {
                  <path [attr.d]="d" />
                }
              </svg>
              {{ item.label }}
            </a>
          }
        </div>
      }
    </nav>

    <div class="sidebar__footer">
      <div class="sidebar__account">
        <span class="sidebar__avatar" aria-hidden="true">{{ initial() }}</span>
        <span class="sidebar__email" [title]="auth.currentUser()?.email">{{ auth.currentUser()?.email }}</span>
      </div>
      <button type="button" class="btn btn--secondary btn--sm btn--block" (click)="logout()">Log out</button>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
