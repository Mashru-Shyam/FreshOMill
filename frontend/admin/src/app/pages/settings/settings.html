<div class="page">
  <div class="page-header">
    <h1>
      Store settings
      <span class="page-header__sub">
        The single source of truth for the contact details shown in the storefront's navbar, footer,
        Contact page and WhatsApp button.
      </span>
    </h1>
  </div>

  @if (saved()) {
    <p class="banner banner--success" role="status">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true">
        <path d="M21.8 10A10 10 0 1 1 17 3.3" /><path d="m9 11 3 3L22 4" />
      </svg>
      Settings saved.
    </p>
  }

  <div class="card">
    @if (loading()) {
      <div class="settings-skeleton" aria-hidden="true">
        @for (i of skeletonSlots; track i) {
          <div class="settings-skeleton__field">
            <div class="skeleton skeleton--text settings-skeleton__label"></div>
            <div class="skeleton settings-skeleton__input"></div>
          </div>
        }
      </div>
      <span class="sr-only" role="status">Loading settings…</span>
    } @else if (error(); as err) {
      <app-empty-state
        variant="error"
        title="We couldn't load your settings"
        [text]="err"
        actionLabel="Try again"
        (action)="refresh()"
      />
    } @else {
      <div class="form-grid">
        <div class="field form-grid--wide">
          <label for="stAddress">Store address</label>
          <textarea id="stAddress" [value]="address()" (input)="address.set($any($event.target).value)"></textarea>
        </div>

        <div class="field">
          <label for="stPhone">Phone (displayed)</label>
          <input id="stPhone" type="text" [value]="phone()" (input)="phone.set($any($event.target).value)" />
        </div>

        <div class="field">
          <label for="stWhatsApp">WhatsApp number (with country code, no spaces)</label>
          <input id="stWhatsApp" type="text" [value]="whatsAppNumber()" (input)="whatsAppNumber.set($any($event.target).value)" />
        </div>

        <div class="field">
          <label for="stEmail">Contact email</label>
          <input id="stEmail" type="email" [value]="email()" (input)="email.set($any($event.target).value)" />
        </div>

        <div class="field">
          <label for="stHours">Opening hours</label>
          <input id="stHours" type="text" [value]="openingHours()" (input)="openingHours.set($any($event.target).value)" />
        </div>

        <div class="field">
          <label for="stMaps">Google Maps link</label>
          <input id="stMaps" type="url" [value]="googleMapsUrl()" (input)="googleMapsUrl.set($any($event.target).value)" />
        </div>

        <div class="field">
          <label for="stInsta">Instagram URL</label>
          <input id="stInsta" type="url" [value]="instagramUrl()" (input)="instagramUrl.set($any($event.target).value)" />
        </div>

        <div class="field">
          <label for="stYoutube">YouTube URL</label>
          <input id="stYoutube" type="url" [value]="youtubeUrl()" (input)="youtubeUrl.set($any($event.target).value)" />
        </div>

        <div class="field">
          <label for="stLinkedIn">LinkedIn URL</label>
          <input id="stLinkedIn" type="url" [value]="linkedInUrl()" (input)="linkedInUrl.set($any($event.target).value)" />
        </div>
      </div>

      <!-- Not a modal footer: this is the page's own action bar, sticky to the bottom of the
           card so Save stays reachable on a long form instead of sitting below the fold. -->
      <div class="settings-actions">
        <button
          type="button"
          class="btn btn--primary"
          [class.is-loading]="saving()"
          [disabled]="saving()"
          (click)="save()"
        >
          <span>Save changes</span>
        </button>
      </div>
    }
  </div>
</div>
