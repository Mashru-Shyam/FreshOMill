<div class="search-bar-row" role="search" #searchWrap>
  <div class="search-bar-row__container">
    <svg appIcon="search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;color:var(--color-body)" aria-hidden="true"></svg>
    <input
      type="text"
      class="search-bar-row__input"
      placeholder="Search fresh flour, grains, organic essentials..."
      aria-label="Search site products"
      [value]="query()"
      (focus)="onSearchFocus()"
      (input)="onSearchInput($event)"
    />
    <button
      type="button"
      class="search-bar-row__clear"
      [class.is-visible]="query().trim().length > 0"
      aria-label="Clear search text"
      (click)="clearSearch()"
    >
      <svg appIcon="x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px" aria-hidden="true"></svg>
    </button>
    <app-search-dropdown
      [open]="overlay.mobileSearchOpen()"
      [query]="query()"
      variant="full"
      (productSelected)="clearSearch()"
    />
  </div>
</div>
