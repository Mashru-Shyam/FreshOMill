<nav class="bottom-nav" aria-label="Primary">
  <a routerLink="/" routerLinkActive="bottom-nav__item--active" [routerLinkActiveOptions]="{ exact: true }" class="bottom-nav__item">
    <svg appIcon="home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px" aria-hidden="true"></svg>
    <span>Home</span>
  </a>

  <a routerLink="/store" routerLinkActive="bottom-nav__item--active" class="bottom-nav__item">
    <svg appIcon="store" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px" aria-hidden="true"></svg>
    <span>Store</span>
  </a>

  <button
    type="button"
    class="bottom-nav__item bottom-nav__item--btn"
    [class.bottom-nav__item--active]="overlay.cartDrawerOpen()"
    aria-label="View cart"
    aria-haspopup="true"
    [attr.aria-expanded]="overlay.cartDrawerOpen()"
    (click)="openCart()"
  >
    <span class="bottom-nav__icon-wrap">
      <svg appIcon="shopping-cart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px" aria-hidden="true"></svg>
      @if (cart.lineCount() > 0) {
        <span class="bottom-nav__badge">{{ cart.lineCount() }}</span>
      }
    </span>
    <span>Cart</span>
  </button>

  <button
    #profileBtn
    type="button"
    class="bottom-nav__item bottom-nav__item--btn"
    [class.bottom-nav__item--active]="overlay.profileOpen()"
    aria-label="Account menu"
    aria-haspopup="true"
    [attr.aria-expanded]="overlay.profileOpen()"
    (click)="onProfileClick($event)"
  >
    @if (auth.isLoggedIn()) {
      <span class="bottom-nav__avatar">{{ auth.currentUser()?.email?.charAt(0) }}</span>
    } @else {
      <svg appIcon="user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px" aria-hidden="true"></svg>
    }
    <span>{{ auth.isLoggedIn() ? 'Account' : 'Sign In' }}</span>
  </button>

  <a routerLink="/contact" routerLinkActive="bottom-nav__item--active" class="bottom-nav__item">
    <svg appIcon="mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px" aria-hidden="true"></svg>
    <span>Contact</span>
  </a>
</nav>
