@if (confirmService.request(); as req) {
  <div class="confirm-overlay" (click)="onOverlayClick($event)">
    <div class="confirm-dialog" role="alertdialog" aria-modal="true" aria-live="assertive">
      <p class="confirm-dialog__message">{{ req.message }}</p>
      <div class="confirm-dialog__actions">
        <button type="button" class="confirm-dialog__btn confirm-dialog__btn--cancel" (click)="cancel()">
          {{ req.cancelLabel }}
        </button>
        <button
          type="button"
          class="confirm-dialog__btn confirm-dialog__btn--confirm"
          [class.confirm-dialog__btn--danger]="req.danger"
          (click)="confirm()"
        >
          {{ req.confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
