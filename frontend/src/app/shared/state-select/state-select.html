<div class="state-select">
  <button
    type="button"
    class="state-select__trigger"
    [class.state-select__trigger--invalid]="invalid()"
    [class.state-select__trigger--placeholder]="!value()"
    aria-haspopup="listbox"
    [attr.aria-expanded]="menuOpen()"
    (click)="toggleMenu()"
    (keydown)="onTriggerKeydown($event)"
  >
    <span>{{ value() || 'Select state' }}</span>
    <svg
      appIcon="chevron-down"
      class="state-select__trigger-icon"
      [class.state-select__trigger-icon--open]="menuOpen()"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      style="width:14px;height:14px;"
      aria-hidden="true"
    ></svg>
  </button>
  <div class="state-select__menu" [class.is-open]="menuOpen()" role="listbox" aria-label="Select state">
    @for (s of states; track s; let i = $index) {
      <button
        type="button"
        class="state-select__option"
        [class.is-selected]="s === value()"
        [class.is-highlighted]="i === highlightedIndex()"
        role="option"
        [attr.aria-selected]="s === value()"
        (click)="select(s)"
      >
        {{ s }}
      </button>
    }
  </div>
</div>
