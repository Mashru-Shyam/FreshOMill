<section class="stories-section" aria-label="Customer Stories">
  <div class="stories-section__header">
    <h2 class="stories-section__title">Customer Stories</h2>
    <div class="stories-section__controls">
      <button type="button" class="stories-arrow" aria-label="Previous customer story"
        [class.is-hidden]="isPrevHidden()" (click)="slide('prev')">
        <svg appIcon="chevron-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;" aria-hidden="true"></svg>
      </button>
      <button type="button" class="stories-arrow" aria-label="Next customer story"
        [class.is-hidden]="isNextHidden()" (click)="slide('next')">
        <svg appIcon="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;" aria-hidden="true"></svg>
      </button>
    </div>
  </div>

  <div class="stories-wrapper">
    <div
      #slider
      class="stories-slider"
      [class.is-dragging]="isDragging()"
      role="region"
      aria-label="Customer reviews slider"
      (scroll)="updateArrows()"
      (pointerdown)="onPointerDown($event)"
      (pointermove)="onPointerMove($event)"
      (pointerup)="endDrag()"
      (pointercancel)="endDrag()"
      (click)="onSliderClick($event)"
    >
      @for (story of testimonials(); track story.name) {
        <div class="story-card">
          <div class="story-card__header">
            <div class="story-card__avatar" [style.background]="story.avatarGradient">{{ story.initial }}</div>
            <div class="story-card__identity">
              <span class="story-card__name">{{ story.name }}</span>
              <span class="story-card__source">
                <svg width="14" height="14" viewBox="0 0 48 48" aria-hidden="true">
                  <path fill="#FFC107"
                    d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z" />
                  <path fill="#FF3D00"
                    d="M6.3 14.7l6.6 4.8C14.5 16 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z" />
                  <path fill="#4CAF50"
                    d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.6 26.7 36 24 36c-5.3 0-9.6-3.4-11.3-8l-6.6 5.1C9.5 39.6 16.2 44 24 44z" />
                  <path fill="#1976D2"
                    d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.6l6.2 5.2C39.9 36.5 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z" />
                </svg>
                Google Review
              </span>
            </div>
          </div>
          <div class="story-card__stars" aria-label="Rated 5 out of 5 stars">
            @for (star of [1, 2, 3, 4, 5]; track star) {
              <svg appIcon="star" class="story-card__star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
            }
          </div>
          <p class="story-card__text">{{ story.text }}</p>
          <a href="#" class="story-card__read-more">Read more</a>
        </div>
      }
    </div>
  </div>
</section>
