<div class="page-canvas"><div class="page page--narrow">
  <div class="page-head">
    <a routerLink="/store" class="page-head__back">
      <svg appIcon="arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px" aria-hidden="true"></svg>
      Continue Shopping
    </a>
    <h1 class="page-head__title">My Profile</h1>
    <p class="page-head__subtitle">Manage your details and saved delivery addresses.</p>
  </div>

  @if (!auth.isLoggedIn()) {
    <div class="empty-state empty-state--gate">
      <svg appIcon="user-cog" class="empty-state__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:40px;height:40px" aria-hidden="true"></svg>
      <h2 class="empty-state__title">Sign in to view your profile</h2>
      <p class="empty-state__text">Save your basic information once and reuse it at checkout.</p>
      <button type="button" class="btn btn--primary empty-state__cta" (click)="openSignIn()">Sign In</button>
    </div>
  } @else {
    <div class="account-page">
      <app-account-summary />
      <div class="account-page__grid">
        <app-account-form />
        <app-address-list />
      </div>
    </div>
  }
</div></div>
