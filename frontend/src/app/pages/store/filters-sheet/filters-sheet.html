<div class="filters-sheet-overlay" [class.filters-sheet-overlay--open]="open()" [attr.aria-hidden]="!open()"
  (click)="onOverlayClick($event)">
  <div class="filters-sheet" role="dialog" aria-modal="true" aria-label="Filter products" [appDialogFocus]="open()">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-head">
      <span class="sheet-head__title">Filters</span>
      <button type="button" class="btn--icon" aria-label="Close filters" (click)="close()">
        <svg appIcon="x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;" aria-hidden="true"></svg>
      </button>
    </div>

    <!-- Same component the desktop rail renders. The controls used to be
         written out a second time here, so the two copies drifted. -->
    <div class="filters-sheet__body">
      <app-filters-panel
        [(inStock)]="inStock"
        [(outOfStock)]="outOfStock"
        [(priceMin)]="priceMin"
        [(priceMax)]="priceMax"
      />
    </div>

    <div class="filters-sheet__foot">
      <button type="button" class="btn btn--primary btn--lg btn--block" (click)="close()">
        Show results
      </button>
    </div>
  </div>
</div>
