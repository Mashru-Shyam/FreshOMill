@if (chips().length) {
  <div class="store-filters__chips">
    @for (chip of chips(); track chip.key) {
      <span class="filter-chip">
        {{ chip.label }}
        <button type="button" class="filter-chip__remove" [attr.aria-label]="'Remove ' + chip.label + ' filter'"
          (click)="remove.emit(chip.key)">
          <svg appIcon="x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;" aria-hidden="true"></svg>
        </button>
      </span>
    }
    <button type="button" class="store-filters__clear-all" (click)="clearAll.emit()">Clear all</button>
  </div>
}
