<div class="sort-dropdown">
  <button type="button" class="sort-dropdown__trigger" aria-haspopup="listbox" [attr.aria-expanded]="menuOpen()"
    (click)="toggleMenu()">
    <span>{{ selectedLabel() }}</span>
    <svg appIcon="chevron-down" class="sort-dropdown__trigger-icon"
      [class.sort-dropdown__trigger-icon--open]="menuOpen()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;" aria-hidden="true"></svg>
  </button>
  <div class="sort-dropdown__menu" [class.is-open]="menuOpen()" role="listbox" aria-label="Sort products">
    @for (option of options; track option.value) {
      <button type="button" class="sort-dropdown__option" [class.is-selected]="option.value === value()"
        role="option" [attr.aria-selected]="option.value === value()" (click)="selectOption(option)">
        {{ option.label }}
      </button>
    }
  </div>
</div>
