<section class="store-toolbar" aria-label="Sort and filter products">
  <div class="store-toolbar__row">
    <!-- Mobile only: the filters themselves live in a bottom sheet below
         960px, where a rail would take the whole screen. -->
    <button type="button" class="btn btn--secondary store-toolbar__filters-btn" aria-haspopup="dialog"
      [attr.aria-expanded]="sheetOpen()" (click)="sheetOpen.set(true)">
      <svg appIcon="sliders-horizontal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;" aria-hidden="true"></svg>
      Filters
      @if (appliedChips().length) {
        <span class="store-toolbar__filters-count">{{ appliedChips().length }}</span>
      }
    </button>

    @if (loading()) {
      <span class="skeleton skeleton--text store-toolbar__count-skeleton" aria-hidden="true"></span>
    } @else {
      <p class="store-toolbar__count" aria-live="polite">
        <strong>{{ resultCount() }}</strong> product{{ resultCount() === 1 ? '' : 's' }}
      </p>
    }

    <div class="store-toolbar__sort">
      <span class="store-toolbar__sort-label" id="storeSortLabel">Sort by</span>
      <app-sort-dropdown [(value)]="sort" />
    </div>
  </div>

  <app-filter-chips [chips]="appliedChips()" (remove)="removeFilter($event)" (clearAll)="clearAllFilters()" />
</section>
